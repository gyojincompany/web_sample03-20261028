<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .bigbox { /* 부모 박스 */
            border: 1px solid red;
            width: 300px;
            height: 300px;

            position: relative;
        }
        .smallbox { /* 자식 박스 */
            border: 1px solid blue;
            width:100px;
            height: 100px;
            background-color: aqua;

            position: absolute;
            right: 10px;
            bottom: 10px;

        }
    </style>
    <title>position 연습</title>
</head>
<body>
    <div class="bigbox">
        큰상자
        <div class="smallbox">작은상자</div>
    </div>
</body>
</html>
